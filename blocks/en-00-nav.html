<style>
.cc-nav{font-family:"Jost","Futura","Century Gothic",sans-serif;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 28px;min-height:100%;font-size:16.5px}
.cc-nav a{color:#3c3c3c;text-decoration:none;padding:4px 0}
.cc-nav a:hover{color:#b03d2e}
.cc-nav a.cc-on{text-decoration:underline;text-decoration-color:#b03d2e;text-underline-offset:7px}
.cc-nav .cc-lang{display:flex;gap:14px;margin-left:12px;font-size:15px;letter-spacing:.06em}
.cc-nav .cc-lang a{color:#68635c}
.cc-nav .cc-lang a.cc-on{color:#b03d2e;font-weight:500;text-underline-offset:5px}
/* phones: Hostnet's own hamburger lists every page in every language, so hide it and show this menu instead */
[class*="MobileHeader_menuIconContainer"],[class*="MobileHeader_dummyMenuIconContainer"],[class*="MobileHeaderMenu_mobileMenu"]{display:none!important}
@media (max-width:760px){.cc-nav{justify-content:flex-start;gap:4px 20px;font-size:16px}.cc-nav .cc-lang{margin-left:0}}
/* phones: FR NL EN small, right-aligned in Hostnet's top bar next to the name (added by the script below) */
.cc-lang-m{display:flex;align-items:center;flex:0 0 auto;gap:12px;padding:0 16px 0 8px;font-family:"Jost","Futura","Century Gothic",sans-serif;font-size:13px;letter-spacing:.06em}
.cc-lang-m a{color:#68635c;text-decoration:none;padding:6px 0}
.cc-lang-m a.cc-on{color:#b03d2e;font-weight:500;text-decoration:underline;text-decoration-color:#b03d2e;text-underline-offset:5px}
html.cc-lm .mobileMenu .cc-nav .cc-lang,html.cc-lm.mobileMenu .cc-nav .cc-lang,html.cc-lm body.mobileMenu .cc-nav .cc-lang{display:none}
[class*="MobileHeader_titleText"]{font-family:"Newsreader",Georgia,serif!important;font-style:italic!important;font-weight:400!important;font-size:24px;color:#3c3c3c}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<nav class="cc-nav" id="cc-nav"></nav>
<script>
(function(){
  var S={
    en:[["Home","/"],["Repertoire","/repertoire"],["Performances","/performances"],["Contact","/contact"]],
    fr:[["Accueil","/fr"],["Répertoire","/fr-repertoire"],["Spectacles","/fr-spectacles"],["Contact","/fr-contact"]],
    nl:[["Home","/nl"],["Repertoire","/nl-repertoire"],["Optredens","/nl-optredens"],["Contact","/nl-contact"]]
  };
  var p=(location.pathname||"/").replace(/\/+$/,"")||"/";
  var seg=p.split("/").pop();
  var lang=/^fr(-|$)/.test(seg)?"fr":/^nl(-|$)/.test(seg)?"nl":"en";
  var nav=document.getElementById("cc-nav"); if(!nav) return;
  var h="";
  S[lang].forEach(function(i){h+='<a href="'+i[1]+'"'+(p===i[1]?' class="cc-on"':'')+'>'+i[0]+'</a>';});
  h+='<span class="cc-lang">';
  [["FR","fr","/fr"],["NL","nl","/nl"],["EN","en","/"]].forEach(function(l){h+='<a href="'+l[2]+'"'+(lang===l[1]?' class="cc-on"':'')+'>'+l[0]+'</a>';});
  nav.innerHTML=h+'</span>';
  var lh='';
  [["FR","fr","/fr"],["NL","nl","/nl"],["EN","en","/"]].forEach(function(l){lh+='<a href="'+l[2]+'"'+(lang===l[1]?' class="cc-on"':'')+'>'+l[0]+'</a>';});
  var tries=0;
  (function addM(){
    var c=document.querySelector('[class*="MobileHeader_container"]');
    if(c){ if(!c.querySelector('.cc-lang-m')){var m=document.createElement('span');m.className='cc-lang-m';m.innerHTML=lh;c.appendChild(m);} document.documentElement.classList.add('cc-lm'); return; }
    if(++tries<40) setTimeout(addM,250);
  })();
})();
</script>
